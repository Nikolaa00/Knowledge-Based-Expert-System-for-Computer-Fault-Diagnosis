[project]
name = "pc-fault-diagnosis"
version = "0.1.0"
description = "Knowledge-based system for diagnosing computer faults from symptoms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
